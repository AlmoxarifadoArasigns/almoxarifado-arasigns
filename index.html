<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>ARASIGNS - Controle de Almoxarifado</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

/* =====================================================
   GERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #111111;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 12px 12px 25px;
}


/* =====================================================
   CABEÇALHO
===================================================== */

.logo {
    text-align: center;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 1px;
    margin-top: 3px;
}

.subtitulo {
    text-align: center;
    font-size: 18px;
    color: #777777;
    margin-bottom: 14px;
}


/* =====================================================
   STATUS
===================================================== */

.status-card {
    background: #eeeeee;
    border-radius: 20px;
    padding: 17px 12px;
    text-align: center;
    margin-bottom: 12px;
}

.status-titulo {
    font-size: 18px;
    font-weight: bold;
}

.codigo {
    font-size: 34px;
    font-weight: bold;
    margin-top: 8px;
    min-height: 40px;
}

.etapa {
    margin-top: 7px;
    font-size: 17px;
    font-weight: bold;
}

.verde {
    color: #16963b;
}

.vermelho {
    color: #d71919;
}


/* =====================================================
   CÂMERA
===================================================== */

.camera-area {
    width: 100%;
    max-width: 600px;
    height: 150px;
    margin: 0 auto 12px;
    overflow: hidden;
    border-radius: 18px;
    background: #111111;
    position: relative;
}

#reader {
    width: 100% !important;
    height: 150px !important;
}

#reader video {
    width: 100% !important;
    height: 150px !important;
    object-fit: cover !important;
}


/* =====================================================
   ESCONDER PAINEL EXTRA DO LEITOR
===================================================== */

#reader__dashboard {
    display: none !important;
}


/* =====================================================
   BOTÕES
===================================================== */

.btn {
    width: 100%;
    border: none;
    border-radius: 18px;
    padding: 15px;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 9px;
    cursor: pointer;
}

.btn-camera {
    background: #111111;
    color: #ffffff;
}

.btn-csv {
    background: #16963b;
    color: #ffffff;
}

.btn-limpar {
    background: #dddddd;
    color: #111111;
}


/* =====================================================
   STATUS DA CÂMERA
===================================================== */

.aviso {
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    margin: 5px 0 9px;
}


/* =====================================================
   MOVIMENTAÇÕES
===================================================== */

.movimentacoes {
    background: #eeeeee;
    border-radius: 20px;
    padding: 15px;
    margin-top: 10px;
}

.movimentacoes h2 {
    font-size: 21px;
    margin-top: 0;
}

.movimento {
    background: #ffffff;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 8px;
}

.movimento strong {
    font-size: 16px;
}

.movimento small {
    color: #777777;
}

.contador {
    text-align: center;
    font-size: 16px;
    color: #666666;
    margin-top: 10px;
}


/* =====================================================
   CELULARES MAIORES
===================================================== */

@media (min-width: 501px) {

    .container {
        padding-top: 20px;
    }

    .logo {
        font-size: 40px;
    }

    .subtitulo {
        font-size: 20px;
    }

}


/* =====================================================
   CELULARES PEQUENOS
===================================================== */

@media (max-width: 380px) {

    .logo {
        font-size: 30px;
    }

    .subtitulo {
        font-size: 16px;
    }

    .status-titulo {
        font-size: 17px;
    }

    .codigo {
        font-size: 30px;
    }

    .etapa {
        font-size: 16px;
    }

    .camera-area {
        height: 140px;
    }

    #reader {
        height: 140px !important;
    }

    #reader video {
        height: 140px !important;
    }

    .btn {
        font-size: 18px;
        padding: 14px;
    }

}

</style>

</head>


<body>


<div class="container">


    <!-- =================================================
         CABEÇALHO
    ================================================== -->

    <div class="logo">
        ARASIGNS
    </div>

    <div class="subtitulo">
        Controle de Almoxarifado
    </div>


    <!-- =================================================
         STATUS
    ================================================== -->

    <div class="status-card">

        <div class="status-titulo">
            Último código lido:
        </div>

        <div
            id="ultimoCodigo"
            class="codigo"
        >
            —
        </div>

        <div
            id="etapa"
            class="etapa"
        >
            👤 Aguardando funcionário...
        </div>

    </div>


    <!-- =================================================
         CÂMERA
    ================================================== -->

    <div class="camera-area">

        <div id="reader"></div>

    </div>


    <!-- =================================================
         CONTROLE DA CÂMERA
    ================================================== -->

    <button
        id="btnCamera"
        class="btn btn-camera"
        onclick="alternarCamera()"
    >
        🟢 CÂMERA ATIVA
    </button>


    <div
        id="statusCamera"
        class="aviso verde"
    >
        📷 Câmera funcionando
    </div>


    <!-- =================================================
         CSV
    ================================================== -->

    <button
        class="btn btn-csv"
        onclick="gerarCSV()"
    >
        📊 GERAR CSV
    </button>


    <!-- =================================================
         LIMPAR
    ================================================== -->

    <button
        class="btn btn-limpar"
        onclick="limparRegistros()"
    >
        🗑️ LIMPAR REGISTROS
    </button>


    <!-- =================================================
         MOVIMENTAÇÕES
    ================================================== -->

    <div class="movimentacoes">

        <h2>
            Movimentações
        </h2>

        <div id="listaMovimentacoes">
            Nenhuma movimentação registrada.
        </div>

        <div
            id="contador"
            class="contador"
        >
            0 movimentações
        </div>

    </div>


</div>


<script>

/* =====================================================
   VARIÁVEIS
===================================================== */

let scanner = null;

let cameraAtiva = false;

let processando = false;

let esperandoFuncionario = true;

let funcionarioAtual = null;


/*
   Recupera os registros do aparelho
*/

let movimentacoes =

    JSON.parse(

        localStorage.getItem(
            "arasigns_movimentacoes"
        )

    ) || [];



/* =====================================================
   BIP
===================================================== */

function bip() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        const audio =
            new AudioContext();

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();

        oscillator.connect(gain);

        gain.connect(
            audio.destination
        );

        oscillator.frequency.value =
            900;

        oscillator.type =
            "sine";

        gain.gain.value =
            0.2;

        oscillator.start();

        setTimeout(
            function() {

                oscillator.stop();

                audio.close();

            },
            120
        );

    } catch (erro) {

        console.log(
            "Erro no bip:",
            erro
        );

    }

}



/* =====================================================
   INICIAR CÂMERA
===================================================== */

async function iniciarCamera() {

    if (cameraAtiva) {
        return;
    }


    document.getElementById(
        "statusCamera"
    ).innerText =
        "📷 Iniciando câmera...";


    document.getElementById(
        "statusCamera"
    ).className =
        "aviso";


    try {

        scanner =
            new Html5Qrcode(
                "reader"
            );


        /*
           IMPORTANTE:

           Não estamos limitando os formatos.

           O leitor poderá detectar
           automaticamente os códigos
           de barras suportados.
        */


        await scanner.start(

            {
                facingMode:
                    "environment"
            },

            {

                fps: 10,


                /*
                   ÁREA DE LEITURA:

                   LARGA
                   +
                   BAIXA

                   Ideal para código de barras.
                */

                qrbox: {

                    width: 350,

                    height: 70

                },


                aspectRatio:
                    1.7777778

            },


            codigoLido,


            function(error) {

                /*
                   Erros normais enquanto
                   procura o código.
                */

            }

        );


        cameraAtiva = true;


        document.getElementById(
            "btnCamera"
        ).innerText =
            "🟢 CÂMERA ATIVA";


        document.getElementById(
            "statusCamera"
        ).innerText =
            "📷 Câmera funcionando";


        document.getElementById(
            "statusCamera"
        ).className =
            "aviso verde";


    } catch (erro) {

        console.error(
            "Erro ao iniciar câmera:",
            erro
        );


        document.getElementById(
            "btnCamera"
        ).innerText =
            "📷 ATIVAR CÂMERA";


        document.getElementById(
            "statusCamera"
        ).innerText =
            "⚠️ Permita o acesso à câmera";


        document.getElementById(
            "statusCamera"
        ).className =
            "aviso vermelho";

    }

}



/* =====================================================
   PARAR CÂMERA
===================================================== */

async function pararCamera() {

    if (!scanner) {
        return;
    }


    try {

        await scanner.stop();

        await scanner.clear();

    } catch (erro) {

        console.log(
            "Erro ao parar câmera:",
            erro
        );

    }


    scanner = null;

    cameraAtiva = false;


    document.getElementById(
        "btnCamera"
    ).innerText =
        "📷 ATIVAR CÂMERA";


    document.getElementById(
        "statusCamera"
    ).innerText =
        "Câmera pausada";


    document.getElementById(
        "statusCamera"
    ).className =
        "aviso";

}



/* =====================================================
   ALTERNAR CÂMERA
===================================================== */

function alternarCamera() {

    if (cameraAtiva) {

        pararCamera();

    } else {

        iniciarCamera();

    }

}



/* =====================================================
   CÓDIGO LIDO
===================================================== */

function codigoLido(codigo) {


    /*
       Evita o mesmo código ser lido
       repetidamente enquanto está
       parado na frente da câmera.
    */

    if (processando) {
        return;
    }


    processando = true;


    setTimeout(
        function() {

            processando = false;

        },
        1200
    );


    codigo =
        String(codigo)
        .trim();


    if (!codigo) {
        return;
    }


    /*
       MOSTRA O CÓDIGO
    */

    document.getElementById(
        "ultimoCodigo"
    ).innerText =
        codigo;


    /*
       BIP
    */

    bip();


    /*
       PRIMEIRO CÓDIGO:
       FUNCIONÁRIO
    */

    if (esperandoFuncionario) {


        funcionarioAtual =
            codigo;


        esperandoFuncionario =
            false;


        document.getElementById(
            "etapa"
        ).innerText =
            "🔧 Aguardando ferramenta...";


        document.getElementById(
            "etapa"
        ).className =
            "etapa verde";


        return;

    }


    /*
       SEGUNDO CÓDIGO:
       FERRAMENTA
    */

    const ferramenta =
        codigo;


    const agora =
        new Date();


    const registro = {

        data:
            agora.toLocaleDateString(
                "pt-BR"
            ),

        hora:
            agora.toLocaleTimeString(
                "pt-BR"
            ),

        funcionario:
            funcionarioAtual,

        ferramenta:
            ferramenta

    };


    /*
       SALVA
    */

    movimentacoes.push(
        registro
    );


    localStorage.setItem(

        "arasigns_movimentacoes",

        JSON.stringify(
            movimentacoes
        )

    );


    /*
       RESET

       Próximo será funcionário.
    */

    funcionarioAtual =
        null;


    esperandoFuncionario =
        true;


    document.getElementById(
        "etapa"
    ).innerText =
        "👤 Aguardando funcionário...";


    document.getElementById(
        "etapa"
    ).className =
        "etapa";


    atualizarLista();

}



/* =====================================================
   ATUALIZAR LISTA
===================================================== */

function atualizarLista() {


    const lista =
        document.getElementById(
            "listaMovimentacoes"
        );


    const contador =
        document.getElementById(
            "contador"
        );


    contador.innerText =

        movimentacoes.length +

        (
            movimentacoes.length === 1
                ? " movimentação"
                : " movimentações"
        );


    if (
        movimentacoes.length === 0
    ) {

        lista.innerHTML =
            "Nenhuma movimentação registrada.";

        return;

    }


    /*
       Mais recente primeiro
    */

    const registros =
        [
            ...movimentacoes
        ].reverse();


    lista.innerHTML =

        registros

        .map(
            function(registro) {

                return `

                    <div class="movimento">

                        <strong>
                            👤 ${escaparHTML(
                                registro.funcionario
                            )}
                        </strong>

                        <br>

                        🔧 ${escaparHTML(
                            registro.ferramenta
                        )}

                        <br>

                        <small>
                            ${registro.data}
                            às
                            ${registro.hora}
                        </small>

                    </div>

                `;

            }
        )

        .join("");

}



/* =====================================================
   SEGURANÇA
===================================================== */

function escaparHTML(texto) {

    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =====================================================
   GERAR CSV
===================================================== */

function gerarCSV() {


    if (
        movimentacoes.length === 0
    ) {

        alert(
            "Não existem movimentações para exportar."
        );

        return;

    }


    let csv =

        "DATA,HORA,FUNCIONARIO,FERRAMENTA\n";


    movimentacoes.forEach(

        function(registro) {

            csv +=

                `"${registro.data}",` +

                `"${registro.hora}",` +

                `"${registro.funcionario}",` +

                `"${registro.ferramenta}"\n`;

        }

    );


    /*
       BOM para o Excel
    */

    const BOM =
        "\uFEFF";


    const blob =

        new Blob(

            [
                BOM + csv
            ],

            {

                type:
                    "text/csv;charset=utf-8;"

            }

        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    const agora =
        new Date();


    const nomeArquivo =

        "ARASIGNS_MOVIMENTACOES_" +

        agora
            .toISOString()
            .slice(
                0,
                10
            ) +

        ".csv";


    link.href =
        url;


    link.download =
        nomeArquivo;


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    URL.revokeObjectURL(
        url
    );


}



/* =====================================================
   LIMPAR REGISTROS
===================================================== */

function limparRegistros() {


    if (
        movimentacoes.length === 0
    ) {

        return;

    }


    const confirmar =

        confirm(

            "⚠️ ATENÇÃO!\n\n" +

            "Isso vai apagar TODAS as movimentações " +

            "salvas neste aparelho.\n\n" +

            "Gere o CSV antes de continuar.\n\n" +

            "Deseja realmente apagar?"

        );


    if (!confirmar) {
        return;
    }


    movimentacoes = [];


    localStorage.removeItem(
        "arasigns_movimentacoes"
    );


    funcionarioAtual =
        null;


    esperandoFuncionario =
        true;


    document.getElementById(
        "ultimoCodigo"
    ).innerText =
        "—";


    document.getElementById(
        "etapa"
    ).innerText =
        "👤 Aguardando funcionário...";


    document.getElementById(
        "etapa"
    ).className =
        "etapa";


    atualizarLista();

}



/* =====================================================
   INICIALIZAÇÃO
===================================================== */

atualizarLista();


/*
   Abre a câmera automaticamente
   ao carregar a página.
*/

window.addEventListener(

    "load",

    function() {

        setTimeout(

            function() {

                iniciarCamera();

            },

            500

        );

    }

);

</script>

</body>

</html>
