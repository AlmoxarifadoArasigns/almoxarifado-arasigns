<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ARASIGNS - Controle de Almoxarifado</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f3f3;
    color: #111;
}

.container {
    max-width: 700px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: #fff;
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

.logo {
    text-align: center;
    font-size: 42px;
    font-weight: 900;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #777;
    font-size: 21px;
    margin-bottom: 30px;
}

.status {
    background: #eeeeee;
    border-radius: 18px;
    padding: 25px;
    text-align: center;
    margin-bottom: 20px;
}

.status-title {
    font-size: 18px;
    font-weight: bold;
}

.codigo {
    font-size: 45px;
    font-weight: 900;
    margin-top: 10px;
}

button {
    width: 100%;
    border: none;
    border-radius: 18px;
    padding: 20px;
    font-size: 21px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 12px;
}

button:active {
    transform: scale(0.98);
}

.btn-scan {
    background: #111;
    color: white;
}

.btn-export {
    background: #168a3a;
    color: white;
}

.btn-clear {
    background: #dddddd;
    color: #111;
}

.movimentacoes {
    margin-top: 28px;
    background: #eeeeee;
    border-radius: 18px;
    padding: 20px;
}

.movimentacoes h2 {
    margin-top: 0;
}

.movimento {
    background: white;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 10px;
}

.movimento strong {
    display: block;
    margin-bottom: 6px;
}

.info {
    color: #777;
    font-size: 14px;
}

.contador {
    text-align: center;
    margin-top: 15px;
    color: #666;
    font-size: 15px;
}

.estado {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

    <div class="logo">
        ARASIGNS
    </div>

    <div class="subtitle">
        Controle de Almoxarifado
    </div>


    <!-- ÚLTIMO CÓDIGO -->

    <div class="status">

        <div class="status-title">
            Último código lido:
        </div>

        <div
            class="codigo"
            id="ultimoCodigo">
            —
        </div>

    </div>


    <!-- BOTÃO DE LEITURA -->

    <button
        class="btn-scan"
        onclick="lerCodigo()">

        📷 LER CÓDIGO

    </button>


    <!-- ESTADO DO SISTEMA -->

    <div
        class="estado"
        id="estadoSistema">

        👤 Aguardando funcionário...

    </div>


    <!-- BOTÃO CSV -->

    <button
        class="btn-export"
        onclick="exportarCSV()">

        📊 GERAR CSV

    </button>


    <!-- LIMPAR -->

    <button
        class="btn-clear"
        onclick="limparRegistros()">

        🗑️ LIMPAR REGISTROS

    </button>


    <!-- MOVIMENTAÇÕES -->

    <div class="movimentacoes">

        <h2>
            Movimentações
        </h2>

        <div id="listaMovimentacoes">

            Nenhuma movimentação registrada.

        </div>

        <div
            class="contador"
            id="contador">

            0 movimentações

        </div>

    </div>

</div>

</div>


<script>

/*
====================================================
 BANCO LOCAL
====================================================
*/

let movimentacoes =
    JSON.parse(
        localStorage.getItem(
            "arasigns_movimentacoes"
        )
    ) || [];


/*
====================================================
 CONTROLE DA LEITURA
====================================================
*/

let etapa = "funcionario";

let funcionarioAtual = null;


/*
====================================================
 LER CÓDIGO
====================================================
*/

function lerCodigo() {

    let codigo =
        prompt(
            etapa === "funcionario"
                ? "🔊 BIP FUNCIONÁRIO\n\nDigite ou escaneie o código:"
                : "🔊 BIP PRODUTO / FERRAMENTA\n\nDigite ou escaneie o código:"
        );


    if (!codigo) {
        return;
    }


    codigo = codigo.trim();


    /*
    MOSTRA O ÚLTIMO CÓDIGO
    */

    document.getElementById(
        "ultimoCodigo"
    ).innerText = codigo;


    /*
    ================================================
    PRIMEIRO BIP
    FUNCIONÁRIO
    ================================================
    */

    if (etapa === "funcionario") {

        funcionarioAtual = codigo;

        etapa = "item";


        document.getElementById(
            "estadoSistema"
        ).innerText =
            "🔧 Agora leia o produto ou ferramenta";


        return;
    }


    /*
    ================================================
    SEGUNDO BIP
    ITEM
    ================================================
    */

    if (etapa === "item") {

        let item = codigo;


        registrarMovimentacao(
            funcionarioAtual,
            item
        );


        funcionarioAtual = null;

        etapa = "funcionario";


        document.getElementById(
            "estadoSistema"
        ).innerText =
            "👤 Aguardando funcionário...";

    }

}


/*
====================================================
 REGISTRAR MOVIMENTAÇÃO
====================================================
*/

function registrarMovimentacao(
    funcionario,
    item
) {

    let agora = new Date();


    let movimentacao = {

        dataHora:
            agora.toLocaleString(
                "pt-BR"
            ),

        funcionario:
            funcionario,

        item:
            item

    };


    /*
    COLOCA NO INÍCIO DA LISTA
    */

    movimentacoes.unshift(
        movimentacao
    );


    /*
    SALVA NO CELULAR
    */

    localStorage.setItem(

        "arasigns_movimentacoes",

        JSON.stringify(
            movimentacoes
        )

    );


    /*
    ATUALIZA TELA
    */

    atualizarLista();


    /*
    MENSAGEM
    */

    alert(

        "✅ MOVIMENTAÇÃO REGISTRADA!\n\n" +

        "Funcionário: " +
        funcionario +

        "\n\nItem: " +
        item

    );

}


/*
====================================================
 MOSTRAR MOVIMENTAÇÕES
====================================================
*/

function atualizarLista() {

    let lista =
        document.getElementById(
            "listaMovimentacoes"
        );


    let contador =
        document.getElementById(
            "contador"
        );


    /*
    SEM REGISTROS
    */

    if (
        movimentacoes.length === 0
    ) {

        lista.innerHTML =
            "Nenhuma movimentação registrada.";

        contador.innerText =
            "0 movimentações";

        return;

    }


    /*
    LIMPA LISTA
    */

    lista.innerHTML = "";


    /*
    CRIA CADA MOVIMENTAÇÃO
    */

    movimentacoes.forEach(
        function(mov) {

            let div =
                document.createElement(
                    "div"
                );


            div.className =
                "movimento";


            div.innerHTML =

                "<strong>👤 Funcionário: " +
                escaparHTML(
                    mov.funcionario
                ) +
                "</strong>" +

                "<strong>🔧 Item: " +
                escaparHTML(
                    mov.item
                ) +
                "</strong>" +

                "<div class='info'>" +
                "🕒 " +
                escaparHTML(
                    mov.dataHora
                ) +
                "</div>";


            lista.appendChild(
                div
            );

        }
    );


    /*
    CONTADOR
    */

    contador.innerText =

        movimentacoes.length +

        (
            movimentacoes.length === 1
                ? " movimentação"
                : " movimentações"
        );

}


/*
====================================================
 ESCAPAR TEXTO
====================================================
*/

function escaparHTML(texto) {

    let div =
        document.createElement(
            "div"
        );

    div.textContent =
        texto;

    return div.innerHTML;

}


/*
====================================================
 GERAR CSV
====================================================
*/

function exportarCSV() {

    /*
    VERIFICA SE EXISTE REGISTRO
    */

    if (
        movimentacoes.length === 0
    ) {

        alert(
            "⚠️ Não existem movimentações para exportar."
        );

        return;

    }


    /*
    CABEÇALHO DO CSV
    */

    let csv =

        "DATA/HORA;" +
        "FUNCIONÁRIO;" +
        "CÓDIGO ITEM\n";


    /*
    ADICIONA OS REGISTROS
    */

    movimentacoes.forEach(
        function(mov) {

            csv +=

                '"' +
                limparCSV(
                    mov.dataHora
                ) +
                '";' +

                '"' +
                limparCSV(
                    mov.funcionario
                ) +
                '";' +

                '"' +
                limparCSV(
                    mov.item
                ) +
                '"\n';

        }
    );


    /*
    CRIA ARQUIVO
    */

    let blob =
        new Blob(

            [
                "\ufeff" +
                csv
            ],

            {
                type:
                    "text/csv;charset=utf-8;"
            }

        );


    /*
    CRIA LINK TEMPORÁRIO
    */

    let url =
        URL.createObjectURL(
            blob
        );


    let link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    /*
    NOME DO ARQUIVO
    */

    let hoje =
        new Date();


    let data =

        hoje.getFullYear() +
        "-" +

        String(
            hoje.getMonth() + 1
        ).padStart(2, "0") +

        "-" +

        String(
            hoje.getDate()
        ).padStart(2, "0");


    link.download =

        "ARASIGNS_MOVIMENTACOES_" +
        data +
        ".csv";


    /*
    FAZ DOWNLOAD
    */

    document.body.appendChild(
        link
    );

    link.click();

    document.body.removeChild(
        link
    );


    URL.revokeObjectURL(
        url
    );


    /*
    AVISO
    */

    alert(
        "📊 CSV GERADO COM SUCESSO!\n\n" +

        movimentacoes.length +

        " movimentações exportadas."
    );

}


/*
====================================================
 LIMPAR CARACTERES QUE PODEM QUEBRAR O CSV
====================================================
*/

function limparCSV(valor) {

    return String(valor)
        .replace(/"/g, '""')
        .replace(/\n/g, " ")
        .replace(/\r/g, " ");

}


/*
====================================================
 LIMPAR TODOS OS REGISTROS
====================================================
*/

function limparRegistros() {

    if (
        movimentacoes.length === 0
    ) {

        alert(
            "Não existem registros para apagar."
        );

        return;

    }


    let confirmar =
        confirm(

            "⚠️ ATENÇÃO!\n\n" +

            "Você vai apagar TODAS as movimentações deste aparelho.\n\n" +

            "Recomendo gerar o CSV antes.\n\n" +

            "Deseja continuar?"

        );


    if (!confirmar) {

        return;

    }


    /*
    APAGA
    */

    movimentacoes = [];


    localStorage.removeItem(
        "arasigns_movimentacoes"
    );


    /*
    RESET
    */

    funcionarioAtual = null;

    etapa = "funcionario";


    document.getElementById(
        "ultimoCodigo"
    ).innerText = "—";


    document.getElementById(
        "estadoSistema"
    ).innerText =
        "👤 Aguardando funcionário...";


    atualizarLista();


    alert(
        "🗑️ Todas as movimentações foram apagadas."
    );

}


/*
====================================================
 INICIALIZAÇÃO
====================================================
*/

atualizarLista();

</script>

</body>

</html>
