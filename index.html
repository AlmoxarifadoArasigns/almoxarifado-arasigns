<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ARASIGNS - Controle de Almoxarifado</title>

<!-- Leitor de código de barras -->
<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f3f3f3;

    color: #111;
}


.container {

    max-width: 700px;

    margin: auto;

    padding: 20px;

}


.card {

    background: white;

    border-radius: 25px;

    padding: 30px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,0.12);

}


.logo {

    text-align: center;

    font-size: 42px;

    font-weight: 900;

}


.subtitle {

    text-align: center;

    color: #777;

    font-size: 21px;

    margin-bottom: 25px;

}


/* STATUS */

.status {

    background: #eee;

    border-radius: 18px;

    padding: 20px;

    text-align: center;

    margin-bottom: 15px;

}


.status-title {

    font-size: 17px;

    font-weight: bold;

}


.codigo {

    font-size: 42px;

    font-weight: 900;

    margin-top: 8px;

}


/* ESTADO */

.estado {

    text-align: center;

    font-size: 19px;

    font-weight: bold;

    margin: 15px 0;

}


/* CAMERA */

.camera-box {

    display: none;

    background: #111;

    border-radius: 18px;

    overflow: hidden;

    margin-bottom: 15px;

}


#reader {

    width: 100%;

}


#reader video {

    width: 100% !important;

    border-radius: 18px;

}


.camera-ativa {

    display: block;

}


/* BOTÕES */

button {

    width: 100%;

    border: none;

    border-radius: 18px;

    padding: 20px;

    font-size: 20px;

    font-weight: bold;

    cursor: pointer;

    margin-top: 10px;

}


button:active {

    transform: scale(0.98);

}


.btn-camera {

    background: #111;

    color: white;

}


.btn-camera.parar {

    background: #b00020;

}


.btn-export {

    background: #168a3a;

    color: white;

}


.btn-clear {

    background: #ddd;

    color: #111;

}


/* MOVIMENTAÇÕES */

.movimentacoes {

    margin-top: 25px;

    background: #eee;

    border-radius: 18px;

    padding: 20px;

}


.movimentacoes h2 {

    margin-top: 0;

}


.movimento {

    background: white;

    border-radius: 13px;

    padding: 15px;

    margin-bottom: 10px;

}


.movimento strong {

    display: block;

    margin-bottom: 5px;

}


.info {

    color: #777;

    font-size: 14px;

}


.contador {

    text-align: center;

    color: #666;

    margin-top: 15px;

}


/* AVISO */

.aviso {

    background: #fff3cd;

    color: #856404;

    border-radius: 12px;

    padding: 12px;

    margin-top: 15px;

    text-align: center;

    font-size: 14px;

}


</style>

</head>


<body>


<div class="container">


<div class="card">


<div class="logo">

ARASIGNS

</div>


<div class="subtitle">

Controle de Almoxarifado

</div>



<!-- ÚLTIMO CÓDIGO -->

<div class="status">

<div class="status-title">

Último código lido:

</div>


<div
id="ultimoCodigo"
class="codigo">

—

</div>

</div>



<!-- CAMERA -->

<div
id="cameraBox"
class="camera-box">

<div id="reader"></div>

</div>



<!-- ESTADO -->

<div
id="estado"
class="estado">

👤 Aguardando funcionário

</div>



<!-- BOTÃO CAMERA -->

<button
id="btnCamera"
class="btn-camera"
onclick="alternarCamera()">

📷 ABRIR CÂMERA

</button>



<!-- EXPORTAR -->

<button
class="btn-export"
onclick="exportarCSV()">

📊 GERAR CSV

</button>



<!-- LIMPAR -->

<button
class="btn-clear"
onclick="limparRegistros()">

🗑️ LIMPAR REGISTROS

</button>



<div
class="aviso">

A câmera permanece aberta para registrar várias movimentações.

</div>



<!-- MOVIMENTAÇÕES -->

<div class="movimentacoes">


<h2>

Movimentações

</h2>


<div id="lista">

Nenhuma movimentação registrada.

</div>


<div
id="contador"
class="contador">

0 movimentações

</div>


</div>


</div>

</div>



<script>


/* ==================================================
   CONFIGURAÇÕES
================================================== */


let scanner = null;

let cameraLigada = false;


/*
   ETAPA DO PROCESSO

   funcionario
   ↓
   item
   ↓
   funcionario
*/


let etapa = "funcionario";


let funcionarioAtual = null;


/*
   Evita o mesmo código ser lido
   várias vezes seguidas
*/


let ultimoScan = "";

let momentoUltimoScan = 0;


/*
   BANCO LOCAL
*/


let movimentacoes =

JSON.parse(

localStorage.getItem(
"arasigns_movimentacoes"
)

) || [];



/* ==================================================
   ABRIR / FECHAR CAMERA
================================================== */


async function alternarCamera() {


    if (cameraLigada) {

        pararCamera();

        return;

    }


    await iniciarCamera();

}



/* ==================================================
   INICIAR CAMERA
================================================== */


async function iniciarCamera() {


    try {


        document
        .getElementById("cameraBox")
        .classList.add("camera-ativa");


        document
        .getElementById("btnCamera")
        .innerText =
        "⛔ FECHAR CÂMERA";


        document
        .getElementById("btnCamera")
        .classList.add("parar");


        /*
           Cria o leitor
        */


        scanner =
        new Html5Qrcode("reader");


        /*
           Procura câmera traseira
        */


        const cameras =
        await Html5Qrcode.getCameras();


        if (!cameras ||
            cameras.length === 0) {

            throw new Error(
                "Nenhuma câmera encontrada."
            );

        }


        let cameraId =
        cameras[0].id;


        /*
           Tenta encontrar
           câmera traseira
        */


        const traseira =
        cameras.find(
            camera =>
                camera.label
                .toLowerCase()
                .includes("back")
                ||
                camera.label
                .toLowerCase()
                .includes("rear")
                ||
                camera.label
                .toLowerCase()
                .includes("traseira")
        );


        if (traseira) {

            cameraId =
            traseira.id;

        }


        /*
           Inicia scanner
        */


        await scanner.start(

            cameraId,

            {

                fps: 10,

                qrbox: {

                    width: 280,

                    height: 180

                },

                aspectRatio: 1.777

            },

            codigoLido,

            erroLeitura => {

                /*
                   Ignora erros normais
                   de procura do código.
                */

            }

        );


        cameraLigada = true;


        atualizarEstado();


    }

    catch (erro) {


        console.error(erro);


        document
        .getElementById("cameraBox")
        .classList.remove("camera-ativa");


        document
        .getElementById("btnCamera")
        .innerText =
        "📷 ABRIR CÂMERA";


        document
        .getElementById("btnCamera")
        .classList.remove("parar");


        alert(

            "❌ Não consegui abrir a câmera.\n\n" +

            "Verifique se o navegador permitiu o acesso à câmera."

        );

    }

}



/* ==================================================
   PARAR CAMERA
================================================== */


async function pararCamera() {


    try {


        if (scanner) {

            await scanner.stop();

            scanner.clear();

            scanner = null;

        }


    }

    catch (erro) {

        console.log(erro);

    }


    cameraLigada = false;


    document
    .getElementById("cameraBox")
    .classList.remove("camera-ativa");


    document
    .getElementById("btnCamera")
    .innerText =
    "📷 ABRIR CÂMERA";


    document
    .getElementById("btnCamera")
    .classList.remove("parar");

}



/* ==================================================
   CÓDIGO FOI LIDO
================================================== */


function codigoLido(codigo) {


    codigo =
    String(codigo)
    .trim();


    /*
       Proteção contra
       múltiplas leituras
    */


    const agora =
    Date.now();


    if (

        codigo === ultimoScan &&

        agora - momentoUltimoScan < 1500

    ) {

        return;

    }


    ultimoScan =
    codigo;


    momentoUltimoScan =
    agora;



    /*
       MOSTRA CÓDIGO
    */


    document
    .getElementById("ultimoCodigo")
    .innerText =
    codigo;



    /*
       SOM
    */


    bip();



    /*
       PRIMEIRO BIP
       FUNCIONÁRIO
    */


    if (etapa === "funcionario") {


        funcionarioAtual =
        codigo;


        etapa =
        "item";


        atualizarEstado();


        return;

    }



    /*
       SEGUNDO BIP
       ITEM
    */


    if (etapa === "item") {


        registrarMovimentacao(

            funcionarioAtual,

            codigo

        );


        funcionarioAtual =
        null;


        etapa =
        "funcionario";


        atualizarEstado();

    }

}



/* ==================================================
   REGISTRAR
================================================== */


function registrarMovimentacao(

    funcionario,

    item

) {


    const agora =
    new Date();


    const registro = {


        dataHora:
        agora.toLocaleString(
            "pt-BR"
        ),


        funcionario:
        funcionario,


        item:
        item

    };


    /*
       Coloca o mais recente
       no topo
    */


    movimentacoes.unshift(
        registro
    );


    /*
       SALVA NO CELULAR
    */


    localStorage.setItem(

        "arasigns_movimentacoes",

        JSON.stringify(
            movimentacoes
        )

    );


    atualizarLista();

}



/* ==================================================
   ATUALIZAR ESTADO
================================================== */


function atualizarEstado() {


    const estado =
    document.getElementById(
        "estado"
    );


    if (etapa === "funcionario") {


        estado.innerText =
        "👤 Aguardando funcionário";


        estado.style.color =
        "#111";


    }


    else {


        estado.innerText =
        "🔧 Agora leia o produto ou ferramenta";


        estado.style.color =
        "#168a3a";

    }

}



/* ==================================================
   BIP
================================================== */


function bip() {


    try {


        const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;


        const audio =
        new AudioContext();


        const oscillator =
        audio.createOscillator();


        const gain =
        audio.createGain();


        oscillator.connect(
            gain
        );


        gain.connect(
            audio.destination
        );


        oscillator.frequency.value =
        900;


        gain.gain.value =
        0.15;


        oscillator.start();


        oscillator.stop(
            audio.currentTime + 0.12
        );


    }

    catch (erro) {

        console.log(erro);

    }

}



/* ==================================================
   LISTA
================================================== */


function atualizarLista() {


    const lista =
    document.getElementById(
        "lista"
    );


    const contador =
    document.getElementById(
        "contador"
    );


    if (
        movimentacoes.length === 0
    ) {


        lista.innerHTML =
        "Nenhuma movimentação registrada.";


        contador.innerText =
        "0 movimentações";


        return;

    }



    lista.innerHTML = "";



    movimentacoes.forEach(

        mov => {


            const div =
            document.createElement(
                "div"
            );


            div.className =
            "movimento";


            div.innerHTML =


                "<strong>👤 Funcionário: " +

                escapar(
                    mov.funcionario
                ) +

                "</strong>" +


                "<strong>🔧 Item: " +

                escapar(
                    mov.item
                ) +

                "</strong>" +


                "<div class='info'>" +

                "🕒 " +

                escapar(
                    mov.dataHora
                ) +

                "</div>";


            lista.appendChild(
                div
            );


        }

    );



    contador.innerText =

        movimentacoes.length +

        (

            movimentacoes.length === 1

            ? " movimentação"

            : " movimentações"

        );

}



/* ==================================================
   SEGURANÇA
================================================== */


function escapar(valor) {


    const div =
    document.createElement(
        "div"
    );


    div.textContent =
    valor;


    return div.innerHTML;

}



/* ==================================================
   EXPORTAR CSV
================================================== */


function exportarCSV() {


    if (
        movimentacoes.length === 0
    ) {


        alert(
            "⚠️ Não existem movimentações para exportar."
        );


        return;

    }



    let csv =

        "DATA/HORA;" +

        "FUNCIONÁRIO;" +

        "CÓDIGO ITEM\n";



    movimentacoes.forEach(

        mov => {


            csv +=

                '"' +

                limparCSV(
                    mov.dataHora
                ) +

                '";"' +

                limparCSV(
                    mov.funcionario
                ) +

                '";"' +

                limparCSV(
                    mov.item
                ) +

                '"\n';

        }

    );



    const blob =
    new Blob(

        [
            "\ufeff" +
            csv
        ],

        {

            type:
            "text/csv;charset=utf-8;"

        }

    );



    const url =
    URL.createObjectURL(
        blob
    );


    const link =
    document.createElement(
        "a"
    );


    link.href =
    url;



    const hoje =
    new Date();


    const data =

        hoje.getFullYear() +

        "-" +

        String(
            hoje.getMonth() + 1
        ).padStart(2, "0") +

        "-" +

        String(
            hoje.getDate()
        ).padStart(2, "0");



    link.download =

        "ARASIGNS_MOVIMENTACOES_" +

        data +

        ".csv";



    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    URL.revokeObjectURL(
        url
    );



    alert(

        "📊 CSV GERADO!\n\n" +

        movimentacoes.length +

        " movimentações exportadas."

    );

}



/* ==================================================
   LIMPAR CSV
================================================== */


function limparCSV(valor) {


    return String(valor)

        .replace(
            /"/g,
            '""'
        )

        .replace(
            /\n/g,
            " "
        )

        .replace(
            /\r/g,
            " "
        );

}



/* ==================================================
   LIMPAR REGISTROS
================================================== */


function limparRegistros() {


    if (
        movimentacoes.length === 0
    ) {


        alert(
            "Não existem registros."
        );


        return;

    }



    const confirmar =
    confirm(

        "⚠️ ATENÇÃO!\n\n" +

        "Isso vai apagar todas as movimentações deste aparelho.\n\n" +

        "Gere o CSV antes de continuar.\n\n" +

        "Deseja realmente apagar?"

    );



    if (!confirmar) {

        return;

    }



    movimentacoes = [];


    localStorage.removeItem(
        "arasigns_movimentacoes"
    );


    funcionarioAtual =
    null;


    etapa =
    "funcionario";


    document
    .getElementById(
        "ultimoCodigo"
    )
    .innerText =
    "—";


    atualizarEstado();


    atualizarLista();


}



/* ==================================================
   INICIALIZA
================================================== */


atualizarLista();

atualizarEstado();


</script>

</body>

</html>
