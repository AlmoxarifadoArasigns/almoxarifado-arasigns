<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Almoxarifado Arasigns</title>

<script
src="https://unpkg.com/html5-qrcode"
type="text/javascript">
</script>

<style>

body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 3px 15px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitulo {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

.status {
    padding: 18px;
    background: #eeeeee;
    border-radius: 12px;
    margin-bottom: 15px;
}

.titulo {
    font-size: 14px;
    color: #777;
    margin-bottom: 8px;
}

.nome {
    font-size: 23px;
    font-weight: bold;
}

.mensagem {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
}

.aguardando {
    background: #eeeeee;
    color: #333;
}

.sucesso {
    background: #d9f7df;
    color: #16752c;
}

.erro {
    background: #ffdede;
    color: #a40000;
}

#reader {
    width: 100%;
    margin-top: 15px;
}

</style>

</head>

<body>


<div class="container">


<h1>ARASIGNS</h1>

<div class="subtitulo">
Controle de Almoxarifado
</div>


<!-- FUNCIONÁRIO -->

<div class="status">

<div class="titulo">
FUNCIONÁRIO
</div>

<div id="funcionario" class="nome">

Aguardando...

</div>

</div>


<!-- PRODUTO -->

<div class="status">

<div class="titulo">
PRODUTO / FERRAMENTA
</div>

<div id="produto" class="nome">

Aguardando...

</div>

</div>


<!-- MENSAGEM -->

<div id="mensagem"
class="mensagem aguardando">

Aguardando crachá...

</div>


<!-- CÂMERA -->

<div id="reader"></div>


</div>


<script>


// ======================================================
// BANCO TEMPORÁRIO
// ======================================================


// FUNCIONÁRIOS

const funcionarios = {

    "84921": "RAFA BOQUETA",

    "10002": "JOÃO",

    "10003": "CARLOS"

};


// PRODUTOS / FERRAMENTAS

const produtos = {

    "7892145000037": "PARAFUSADEIRA MAKITA #03",

    "20002": "LIXADEIRA #02",

    "20003": "BATERIA #07"

};


// ======================================================
// CONTROLE
// ======================================================

let etapa = "funcionario";

let funcionarioAtual = null;

let leitor = null;

let processando = false;


// ======================================================
// SOM
// ======================================================

function tocarBip(tipo) {

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContext) {
        return;
    }

    const audio =
        new AudioContext();

    const oscilador =
        audio.createOscillator();

    const ganho =
        audio.createGain();


    oscilador.connect(ganho);

    ganho.connect(audio.destination);


    if (tipo === "funcionario") {

        // BIP curto
        oscilador.frequency.value = 800;

        ganho.gain.value = 0.15;

        oscilador.start();

        setTimeout(function() {

            oscilador.stop();

            audio.close();

        }, 100);

    }


    else if (tipo === "produto") {

        // BIP mais agudo
        oscilador.frequency.value = 1200;

        ganho.gain.value = 0.15;

        oscilador.start();

        setTimeout(function() {

            oscilador.stop();

            audio.close();

        }, 150);

    }


    else if (tipo === "erro") {

        // BIP grave
        oscilador.frequency.value = 300;

        ganho.gain.value = 0.20;

        oscilador.start();

        setTimeout(function() {

            oscilador.stop();

            audio.close();

        }, 300);

    }

}


// ======================================================
// INICIAR LEITOR
// ======================================================

function iniciarLeitor() {


    if (leitor) {
        return;
    }


    leitor =
        new Html5Qrcode("reader");


    const configuracao = {

        fps: 10,

        qrbox: {

            width: 280,

            height: 150

        }

    };


    leitor.start(

        {
            facingMode: "environment"
        },

        configuracao,


        function(codigo) {

            processarCodigo(codigo);

        },


        function(error) {

            // Erros durante a procura do código
            // são ignorados.

        }


    ).catch(function(error) {

        document.getElementById(
            "mensagem"
        ).innerText =
        "Erro ao acessar a câmera.";

        console.log(error);

    });

}


// ======================================================
// PROCESSAR CÓDIGO
// ======================================================

function processarCodigo(codigo) {


    if (processando) {
        return;
    }


    processando = true;


    // ==================================================
    // PRIMEIRO BIP
    // FUNCIONÁRIO
    // ==================================================

    if (etapa === "funcionario") {


        if (!funcionarios[codigo]) {


            tocarBip("erro");


            mostrarMensagem(
                "❌ Crachá não cadastrado",
                "erro"
            );


            processando = false;

            return;

        }


        // Funcionário encontrado

        funcionarioAtual =
            funcionarios[codigo];


        document.getElementById(
            "funcionario"
        ).innerText =
            funcionarioAtual;


        document.getElementById(
            "produto"
        ).innerText =
            "Aguardando...";


        tocarBip("funcionario");


        mostrarMensagem(
            "Passe o produto ou ferramenta",
            "aguardando"
        );


        etapa = "produto";


        reiniciarLeitor();


        return;

    }


    // ==================================================
    // SEGUNDO BIP
    // PRODUTO / FERRAMENTA
    // ==================================================

    if (etapa === "produto") {


        if (!produtos[codigo]) {


            tocarBip("erro");


            mostrarMensagem(
                "❌ Produto não cadastrado",
                "erro"
            );


            processando = false;

            return;

        }


        const nomeProduto =
            produtos[codigo];


        document.getElementById(
            "produto"
        ).innerText =
            nomeProduto;


        tocarBip("produto");


        mostrarMensagem(
            "✅ MOVIMENTAÇÃO REGISTRADA",
            "sucesso"
        );


        registrarMovimentacao(

            funcionarioAtual,

            codigo,

            nomeProduto

        );


        etapa = "finalizado";


        pararLeitor();


        // Espera 2 segundos
        // e volta para o próximo funcionário

        setTimeout(function() {

            resetarSistema();

        }, 2000);

    }

}


// ======================================================
// REGISTRAR MOVIMENTAÇÃO
// ======================================================

function registrarMovimentacao(

    funcionario,
    codigo,
    produto

) {


    const agora =
        new Date();


    const movimentacao = {

        data:
            agora.toLocaleString("pt-BR"),

        funcionario:
            funcionario,

        codigo:
            codigo,

        produto:
            produto,

        movimento:
            "SAÍDA"

    };


    console.log(
        "MOVIMENTAÇÃO:",
        movimentacao
    );

}


// ======================================================
// REINICIAR LEITOR
// ======================================================

function reiniciarLeitor() {


    pararLeitor();


    setTimeout(function() {


        processando = false;


        iniciarLeitor();


    }, 500);

}


// ======================================================
// PARAR LEITOR
// ======================================================

function pararLeitor() {


    if (!leitor) {
        return;
    }


    leitor.stop()

    .then(function() {


        leitor.clear();

        leitor = null;


    })

    .catch(function(error) {


        leitor = null;

        console.log(error);


    });

}


// ======================================================
// RESETAR SISTEMA
// ======================================================

function resetarSistema() {


    etapa = "funcionario";


    funcionarioAtual = null;


    processando = false;


    document.getElementById(
        "funcionario"
    ).innerText =
        "Aguardando...";


    document.getElementById(
        "produto"
    ).innerText =
        "Aguardando...";


    mostrarMensagem(
        "Aguardando crachá...",
        "aguardando"
    );


    iniciarLeitor();

}


// ======================================================
// MENSAGEM
// ======================================================

function mostrarMensagem(
    texto,
    tipo
) {


    const elemento =
        document.getElementById(
            "mensagem"
        );


    elemento.innerText =
        texto;


    elemento.className =
        "mensagem " + tipo;

}


// ======================================================
// INICIAR SISTEMA
// ======================================================

iniciarLeitor();


</script>


</body>

</html>
