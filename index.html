<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARASIGNS - Controle de Almoxarifado</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f3f3;
    color: #111;
}

.container {
    max-width: 650px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

h1 {
    text-align: center;
    font-size: 42px;
    margin: 0;
}

.subtitle {
    text-align: center;
    color: #777;
    font-size: 22px;
    margin-bottom: 30px;
}

.status {
    background: #eee;
    border-radius: 18px;
    padding: 25px;
    text-align: center;
    margin-bottom: 20px;
}

.status-title {
    font-size: 18px;
    font-weight: bold;
}

.codigo {
    font-size: 45px;
    font-weight: bold;
    margin-top: 10px;
}

button {
    width: 100%;
    border: none;
    border-radius: 18px;
    padding: 20px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 12px;
}

.btn-scan {
    background: #111;
    color: white;
}

.btn-export {
    background: #1b8f3a;
    color: white;
}

.btn-clear {
    background: #ddd;
    color: #111;
}

.movimentacoes {
    margin-top: 25px;
    background: #eee;
    border-radius: 18px;
    padding: 20px;
}

.movimento {
    background: white;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 10px;
}

.movimento strong {
    display: block;
    margin-bottom: 5px;
}

.info {
    color: #666;
    font-size: 14px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>ARASIGNS</h1>

<div class="subtitle">
Controle de Almoxarifado
</div>

<div class="status">

<div class="status-title">
Último código lido:
</div>

<div class="codigo" id="ultimoCodigo">
—
</div>

</div>

<button class="btn-scan" onclick="lerCodigo()">
📷 LER CÓDIGO
</button>

<button class="btn-export" onclick="exportarCSV()">
📥 EXPORTAR CSV
</button>

<button class="btn-clear" onclick="limparRegistros()">
🗑️ LIMPAR REGISTROS
</button>

<div class="movimentacoes">

<h2>
Movimentações
</h2>

<div id="listaMovimentacoes">
Nenhuma movimentação registrada.
</div>

</div>

</div>

</div>

<script>

let movimentacoes =
JSON.parse(localStorage.getItem("arasigns_movimentacoes")) || [];

let etapa = "funcionario";

let funcionarioAtual = null;


// ================================
// LEITURA DO CÓDIGO
// ================================

function lerCodigo() {

    let codigo = prompt("Digite ou escaneie o código:");

    if (!codigo) return;

    codigo = codigo.trim();

    document.getElementById("ultimoCodigo").innerText = codigo;

    // PRIMEIRO BIP = FUNCIONÁRIO

    if (etapa === "funcionario") {

        funcionarioAtual = codigo;

        etapa = "item";

        alert(
            "👤 FUNCIONÁRIO REGISTRADO\n\n" +
            "Código: " + codigo +
            "\n\nAgora leia o produto ou ferramenta."
        );

        return;
    }


    // SEGUNDO BIP = ITEM

    if (etapa === "item") {

        let item = codigo;

        registrarMovimentacao(
            funcionarioAtual,
            item
        );

        funcionarioAtual = null;

        etapa = "funcionario";

    }

}


// ================================
// REGISTRAR MOVIMENTAÇÃO
// ================================

function registrarMovimentacao(funcionario, item) {

    let agora = new Date();

    let movimentacao = {

        dataHora: agora.toLocaleString("pt-BR"),

        funcionario: funcionario,

        item: item

    };

    movimentacoes.unshift(movimentacao);

    localStorage.setItem(
        "arasigns_movimentacoes",
        JSON.stringify(movimentacoes)
    );

    atualizarLista();

    alert(
        "✅ MOVIMENTAÇÃO REGISTRADA!\n\n" +
        "Funcionário: " + funcionario +
        "\nItem: " + item
    );

}


// ================================
// MOSTRAR MOVIMENTAÇÕES
// ================================

function atualizarLista() {

    let lista =
        document.getElementById("listaMovimentacoes");

    if (movimentacoes.length === 0) {

        lista.innerHTML =
            "Nenhuma movimentação registrada.";

        return;
    }

    lista.innerHTML = "";

    movimentacoes.forEach(function(mov) {

        let div =
            document.createElement("div");

        div.className = "movimento";

        div.innerHTML =

            "<strong>👤 Funcionário: " +
            mov.funcionario +
            "</strong>" +

            "<strong>🔧 Item: " +
            mov.item +
            "</strong>" +

            "<div class='info'>" +
            "🕒 " + mov.dataHora +
            "</div>";

        lista.appendChild(div);

    });

}


// ================================
// EXPORTAR CSV
// ================================

function exportarCSV() {

    if (movimentacoes.length === 0) {

        alert(
            "Não existem movimentações para exportar."
        );

        return;
    }

    let csv =
        "DATA/HORA;FUNCIONÁRIO;CÓDIGO ITEM\n";


    movimentacoes.forEach(function(mov) {

        csv +=
            '"' + mov.dataHora + '";' +
            '"' + mov.funcionario + '";' +
            '"' + mov.item + '"\n';

    });


    let blob = new Blob(
        ["\ufeff" + csv],
        {
            type: "text/csv;charset=utf-8;"
        }
    );


    let url =
        URL.createObjectURL(blob);


    let link =
        document.createElement("a");

    link.href = url;

    link.download =
        "movimentacoes_arasigns.csv";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

}


// ================================
// LIMPAR REGISTROS
// ================================

function limparRegistros() {

    if (movimentacoes.length === 0) {

        alert(
            "Não existem registros."
        );

        return;
    }


    let confirmar =
        confirm(
            "⚠️ ATENÇÃO!\n\n" +
            "Isso vai apagar todas as movimentações deste dispositivo.\n\n" +
            "Você já exportou o CSV?"
        );


    if (!confirmar) return;


    movimentacoes = [];

    localStorage.removeItem(
        "arasigns_movimentacoes"
    );

    atualizarLista();

    document.getElementById(
        "ultimoCodigo"
    ).innerText = "—";


    alert(
        "🗑️ Registros apagados."
    );

}


// ================================
// CARREGAR AO ABRIR
// ================================

atualizarLista();

</script>

</body>
</html>
